<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>SecureTrade Journal · Edge Dashboard</title>
<style>
:root {
  --bg:#0b0f14; --panel:#121821; --panel2:#182130; --border:#243044;
  --text:#e7eef8; --muted:#8b9bb4; --green:#3ddc97; --red:#ff5c7a;
  --amber:#f0b429; --blue:#5b9fd4; --grid:#1c2738;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; background:var(--bg); color:var(--text);
  font:14px/1.45 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
.wrap { max-width:1200px; margin:0 auto; padding:28px 20px 60px; }
header { margin-bottom:28px; }
header h1 { margin:0 0 6px; font-size:28px; letter-spacing:-0.02em; }
header .sub { color:var(--muted); font-size:13px; }
.kpis { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; margin:22px 0 28px; }
@media (max-width:900px) { .kpis { grid-template-columns:repeat(2,1fr); } }
.kpi { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; }
.kpi .label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:0.06em; }
.kpi .value { font-size:22px; font-weight:700; margin-top:4px; font-variant-numeric:tabular-nums; }
.kpi .value.pos { color:var(--green); } .kpi .value.neg { color:var(--red); }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media (max-width:900px) { .grid { grid-template-columns:1fr; } }
.card { background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:16px 18px 14px; margin-bottom:0; }
.card h2 { margin:0 0 4px; font-size:15px; font-weight:650; }
.card .takeaway { margin:10px 0 0; padding:8px 10px; background:var(--panel2); border-left:3px solid var(--blue);
  border-radius:0 8px 8px 0; color:#c5d3e8; font-size:12.5px; }
.full { grid-column:1 / -1; }
svg { width:100%; height:auto; display:block; margin-top:8px; }
.bar-row { display:grid; grid-template-columns:130px 1fr 72px; gap:8px; align-items:center; margin:6px 0; font-size:12.5px; cursor:default; }
.bar-track { height:10px; background:var(--grid); border-radius:99px; overflow:hidden; }
.bar-fill { height:100%; border-radius:99px; } .bar-fill.pos { background:var(--green); } .bar-fill.neg { background:var(--red); }
.cal { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin-top:10px; }
.cal .day { background:var(--panel2); border:1px solid var(--border); border-radius:10px; padding:10px 8px; min-height:74px; text-align:center; }
.cal .day.green { background:rgba(61,220,151,0.12); border-color:rgba(61,220,151,0.35); }
.cal .day.red { background:rgba(255,92,122,0.12); border-color:rgba(255,92,122,0.35); }
.cal .day .wd { color:var(--muted); font-size:11px; }
.cal .day .amt { font-weight:700; margin-top:6px; font-variant-numeric:tabular-nums; }
.two-col { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
@media (max-width:700px) { .two-col { grid-template-columns:1fr; } }
table { width:100%; border-collapse:collapse; font-size:12.5px; font-variant-numeric:tabular-nums; }
th,td { text-align:left; padding:7px 6px; border-bottom:1px solid var(--border); }
th { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.04em; }
.pos { color:var(--green); } .neg { color:var(--red); }
.pill { display:inline-block; padding:2px 8px; border-radius:99px; background:var(--panel2); border:1px solid var(--border); font-size:11px; color:var(--muted); }
.leak { display:flex; gap:12px; padding:10px 0; border-bottom:1px solid var(--border); align-items:flex-start; }
.leak:last-child { border-bottom:0; }
.leak .rank { width:28px; height:28px; border-radius:8px; background:rgba(255,92,122,0.15); color:var(--red);
  display:flex; align-items:center; justify-content:center; font-weight:700; flex-shrink:0; }
.leak .body { flex:1; } .leak .title { font-weight:650; } .leak .detail { color:var(--muted); font-size:12px; margin-top:2px; }
.leak .amt { font-weight:700; color:var(--red); font-variant-numeric:tabular-nums; white-space:nowrap; }
ul.clean { margin:8px 0 0; padding-left:18px; } ul.clean li { margin:5px 0; color:#d5deec; }
.tooltip-layer { position:fixed; pointer-events:none; z-index:50; background:#0f1622f2; border:1px solid var(--border);
  color:var(--text); padding:8px 10px; border-radius:8px; font-size:12px; max-width:280px; display:none; box-shadow:0 8px 24px #0008; white-space:pre-wrap; }
.compare { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.compare .box { background:var(--panel2); border-radius:10px; padding:12px; border:1px solid var(--border); }
.compare h3 { margin:0 0 8px; font-size:13px; color:var(--muted); font-weight:600; }
.metric { display:flex; justify-content:space-between; padding:4px 0; font-size:12.5px; border-bottom:1px dashed var(--border); gap:10px; }
.metric:last-child { border-bottom:0; }
.foot { margin-top:24px; color:var(--muted); font-size:11.5px; }
</style>

const tip = document.getElementById('tip');
const fmt$ = (n, dig=2) => (n<0?'-':'') + '$' + Math.abs(n).toFixed(dig);
const fmtPct = (n) => ((n||0)*100).toFixed(1) + '%';
const cls = (n) => n>0 ? 'pos' : (n<0 ? 'neg' : '');

function showTip(e, html) {
  tip.style.display = 'block';
  tip.innerHTML = html;
  tip.style.left = Math.min(e.clientX + 12, window.innerWidth - 280) + 'px';
  tip.style.top = Math.min(e.clientY + 12, window.innerHeight - 80) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

document.addEventListener('mousemove', (e) => {
  const el = e.target.closest('[data-tip]');
  if (!el) { hideTip(); return; }
  showTip(e, el.getAttribute('data-tip'));
});
document.addEventListener('mouseleave', hideTip);

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

function barList(obj, order=null) {
  const keys = order ? order.filter(k => k in obj || true).filter(k => order.includes(k)) : Object.keys(obj);
  const present = keys.filter(k => obj[k]);
  const max = Math.max(...present.map(k => Math.abs(obj[k].pnl||0)), 0.01);
  return keys.map(key => {
    const s = obj[key];
    if (!s || !s.n) {
      return `<div class="bar-row"><div>${esc(key)}</div><div class="bar-track"></div><div style="color:var(--muted)">n=0</div></div>`;
    }
    const w = Math.max(4, Math.abs(s.pnl)/max*100);
    const tipHtml = esc(`<b>${key}</b><br>n=${s.n} · WR ${fmtPct(s.wr)} · PF ${s.pf>100?'∞':s.pf.toFixed(2)}<br>Exp ${fmt$(s.exp,3)} · PnL ${fmt$(s.pnl)}`);
    // tip stores HTML; use unescaped carefully via data-tip with plain text alternative
    const tipText = `${key} | n=${s.n} | WR ${fmtPct(s.wr)} | PF ${s.pf>100?'∞':s.pf.toFixed(2)} | Exp ${fmt$(s.exp,3)} | PnL ${fmt$(s.pnl)}`;
    return `<div class="bar-row" data-tip="${esc(tipText)}">
      <div>${esc(key)}</div>
      <div class="bar-track"><div class="bar-fill ${cls(s.pnl)}" style="width:${w}%"></div></div>
      <div class="${cls(s.pnl)}">${fmt$(s.pnl)}</div>
    </div>`;
  }).join('');
}

function equitySVG(points, labelKey) {
  const W=720, H=220, padL=52, padR=16, padT=18, padB=36;
  const ys = points.map(p => p.cum);
  const minY = Math.min(...ys, 0), maxY = Math.max(...ys, 0);
  const span = Math.max(maxY - minY, 0.05);
  const x = i => padL + (i / Math.max(points.length - 1, 1)) * (W - padL - padR);
  const y = v => padT + (1 - (v - minY) / span) * (H - padT - padB);
  const y0 = y(0);
  let d = '';
  points.forEach((p,i) => { d += (i?'L':'M') + x(i).toFixed(1) + ',' + y(p.cum).toFixed(1) + ' '; });
  const area = d + `L ${x(points.length-1)} ${y0} L ${x(0)} ${y0} Z`;
  const last = points[points.length-1].cum;
  const color = last >= 0 ? '#3ddc97' : '#ff5c7a';
  const yTicks = [minY, 0, maxY].filter((v,i,a) => a.indexOf(v)===i);
  const labels = yTicks.map(v =>
    `<text x="6" y="${y(v)+4}" fill="#8b9bb4" font-size="10">${fmt$(v,2)}</text>
     <line x1="${padL}" y1="${y(v)}" x2="${W-padR}" y2="${y(v)}" stroke="#1c2738" stroke-dasharray="3,4"/>`
  ).join('');
  const dots = points.map((p,i) => {
    const name = p.symbol || p.week || '';
    const tipText = `${name} · ${fmt$(p.pnl)} → equity ${fmt$(p.cum)}`;
    return `<circle cx="${x(i)}" cy="${y(p.cum)}" r="4" fill="${p.pnl>=0?'#3ddc97':'#ff5c7a'}"
      data-tip="${esc(tipText)}" style="cursor:pointer"></circle>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${labels}
    <line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="#5b9fd466" stroke-width="1"/>
    <path d="${area}" fill="${color}22"></path>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"></path>
    ${dots}</svg>`;
}

function edgeBox(label, e, color) {
  const top = (obj) => Object.entries(obj||{}).sort((a,b)=>b[1]-a[1])[0]?.[0] || '—';
  const rows = [
    ['Trades', e.n],
    ['Avg hold', e.avg_hold_h!=null?e.avg_hold_h.toFixed(2)+'h':'—'],
    ['Avg notional', e.avg_notional!=null?fmt$(e.avg_notional):'—'],
    ['Avg fills', e.avg_fills!=null?e.avg_fills.toFixed(2):'—'],
    ['Long %', fmtPct(e.long_pct)],
    ['Avg RSI (signal)', e.avg_rsi!=null?e.avg_rsi.toFixed(1):'—'],
    ['Avg ADX (signal)', e.avg_adx!=null?e.avg_adx.toFixed(1):'—'],
    ['Top regime', top(e.regimes)],
    ['Top exit', top(e.exits)],
  ];
  return `<div class="box"><h3 style="color:${color}">${label}</h3>
    ${rows.map(([a,b]) => `<div class="metric"><span>${a}</span><b>${b}</b></div>`).join('')}
  </div>`;
}
document.getElementById('edge-card').innerHTML = `<h2>Winners vs losers · behavioral edge</h2>
  <div class="compare">${edgeBox('Winners', D.edge.winners, 'var(--green)')}${edgeBox('Losers', D.edge.losers, 'var(--red)')}</div>
  <div class="takeaway">Winners scale out (2.6 fills) and hold a bit longer; losers die on STOP_LOSS / REVERSED — top 5 trades = ${k.top5_pct_gross}% of gross profit · longest losing streak ${k.longest_lose_streak}.</div>`;

function mktBox(label, m, color) {
  const rows = [
    ['Symbols', (m.names||[]).join(', ')||'—'],
    ['Day range', m.day_range_pct!=null?m.day_range_pct.toFixed(2)+'%':'—'],
    ['RVOL', m.rvol!=null?m.rvol.toFixed(2):'—'],
    ['ADR14', m.adr14_pct!=null?m.adr14_pct.toFixed(2)+'%':'—'],
    ['Daily RSI', m.rsi14!=null?m.rsi14.toFixed(1):'—'],
    ['RV20 ann.', m.rv20_ann!=null?m.rv20_ann.toFixed(1)+'%':'—'],
  ];
  return `<div class="box"><h3 style="color:${color}">${label}</h3>
    ${rows.map(([a,b]) => `<div class="metric"><span>${a}</span><b>${b}</b></div>`).join('')}
  </div>`;
}
const me = D.market_edge;
const mktRows = Object.entries(me.per_symbol).sort((a,b)=>a[1].pnl-b[1].pnl).map(([s,v]) => {
  const tipText = `${s}: range ${v.day_range_pct?.toFixed(2)}% · RVOL ${v.rvol?.toFixed(2)} · RSI ${v.rsi14?.toFixed(1)}`;
  return `<tr data-tip="${esc(tipText)}">
    <td>${esc(s)}</td><td class="${cls(v.pnl)}">${fmt$(v.pnl)}</td>
    <td>${v.day_range_pct!=null?v.day_range_pct.toFixed(2)+'%':'—'}</td>
    <td>${v.rvol!=null?v.rvol.toFixed(2):'—'}</td>
    <td>${v.adr14_pct!=null?v.adr14_pct.toFixed(2)+'%':'—'}</td>
    <td>${v.rsi14!=null?v.rsi14.toFixed(1):'—'}</td>
  </tr>`;
}).join('');
document.getElementById('market-card').innerHTML = `<h2>Market-data edge profile <span class="pill">yfinance</span></h2>
  <div class="compare">${mktBox('Winning symbols', me.winning_symbols, 'var(--green)')}${mktBox('Losing symbols', me.losing_symbols, 'var(--red)')}</div>
  <table style="margin-top:12px"><thead><tr><th>Symbol</th><th>PnL</th><th>Range</th><th>RVOL</th><th>ADR14</th><th>RSI</th></tr></thead>
  <tbody>${mktRows}</tbody></table>
  <div class="takeaway">Winning names ran hotter tape (range ~4.7% / RVOL ~0.92) vs losers (~3.1% / 0.83) — screen for expansion, not quiet mega-caps like BTC on a 1.3% day.</div>`;

document.getElementById('leaks-card').innerHTML = `<h2>Hidden leaks</h2>
  ${D.leaks.map((L,i) => `<div class="leak">
    <div class="rank">${i+1}</div>
    <div class="body"><div class="title">${esc(L.title)}</div><div class="detail">${esc(L.detail)}</div></div>
    <div class="amt">${fmt$(L.pnl)}</div>
  </div>`).join('')}
  <div class="takeaway">Plug stops-on-shorts and midday overtrading first — those five conditions explain more than the headline −$0.93.</div>`;

document.getElementById('focus-card').innerHTML = `<h2>Focus screen</h2><ul class="clean">${D.focus.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <div class="takeaway">Your edge sketch: long, expanding-range crypto, ADX&gt;25, scale-out, 10–11 ET.</div>`;

document.getElementById('avoid-card').innerHTML = `<h2>Avoid screen</h2><ul class="clean">${D.avoid.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
  <div class="takeaway">Hard filters next session: no FX shorts · no 4+ names · no entries after 14:00 · skip ADA-like grinders.</div>`;

document.getElementById('foot').textContent =
  `Generated ${D.meta.generated_at} · ${D.meta.source} · Open positions ignored · P&L reconciled to overnight net (−$0.9315) · Offline · No external libraries`;

</script>
