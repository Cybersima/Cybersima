yahoo:
  enabled: true
  poll_seconds: 2.0
  symbols:
    - ticker: EURUSD=X
      canonical: EUR-USD
      asset_class: fx
    - ticker: GBPUSD=X
      canonical: GBP-USD
      asset_class: fx
    - ticker: USDJPY=X
      canonical: USD-JPY
      asset_class: fx
    - ticker: AUDUSD=X
      canonical: AUD-USD
      asset_class: fx
    - ticker: USDCAD=X
      canonical: USD-CAD
      asset_class: fx
    - ticker: USDCHF=X
      canonical: USD-CHF
      asset_class: fx
    - ticker: NZDUSD=X
      canonical: NZD-USD
      asset_class: fx
    - ticker: EURGBP=X
      canonical: EUR-GBP
      asset_class: fx
    - ticker: EURJPY=X
      canonical: EUR-JPY
      asset_class: fx
    - ticker: GBPJPY=X
      canonical: GBP-JPY
      asset_class: fx
    - ticker: EURCHF=X
      canonical: EUR-CHF
      asset_class: fx
    - ticker: AUDJPY=X
      canonical: AUD-JPY
      asset_class: fx
    - ticker: USDCNH=X
      canonical: USD-CNH
      asset_class: fx
    - ticker: USDSEK=X
      canonical: USD-SEK
      asset_class: fx
    - ticker: USDNOK=X
      canonical: USD-NOK
      asset_class: fx
    - ticker: USDMXN=X
      canonical: USD-MXN
      asset_class: fx
    - ticker: BTC-USD
      canonical: BTC-USD
      asset_class: crypto
    - ticker: ETH-USD
      canonical: ETH-USD
      asset_class: crypto
    - ticker: SOL-USD
      canonical: SOL-USD
      asset_class: crypto
    - ticker: XRP-USD
      canonical: XRP-USD
      asset_class: crypto
    - ticker: GC=F
      canonical: XAU-USD
      asset_class: metal
    - ticker: SI=F
      canonical: XAG-USD
      asset_class: metal
    - ticker: CL=F
      canonical: WTI-USD
      asset_class: energy

usd_equivalents:
  - USD
  - USDT
  - USDC
  - FDUSD

