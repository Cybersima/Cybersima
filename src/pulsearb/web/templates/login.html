<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#05070c" />
  <title>{{ product }} lock</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("cybersym-theme");
        if (theme !== "light" && theme !== "dark") theme = "dark";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (err) {}
    })();
  </script>
  <link rel="icon" href="/static/logo.png" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <div class="app lock-app">
    <header class="masthead">
      <div class="brand">
        <img class="logo" src="/static/logo.png" width="72" height="72" alt="{{ company }} crest" />
        <div class="brand-copy">
          <p class="company">{{ company }}</p>
          <h1>{{ product_short }}</h1>
          <p class="lede">Enter the lock PIN from the black SecureTrade window.</p>
        </div>
      </div>
    </header>
    <section class="desk-block lock-card">
      <label for="pin">Dashboard lock PIN</label>
      <form id="lock-form">
        <input id="pin" name="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="6-digit PIN" />
        <button type="submit" class="invest-btn">Unlock</button>
      </form>
      <p class="hint" id="lock-hint">This computer’s browser should unlock by itself. Phone or iPad: type the PIN printed in the black window. Keys never go in the browser.</p>
      <p class="hint" id="lock-error" hidden></p>
    </section>
  </div>
  <script>
    const form = document.getElementById("lock-form");
    const pin = document.getElementById("pin");
    const err = document.getElementById("lock-error");
    form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      err.hidden = true;
      try {
        const res = await fetch("/api/unlock", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ pin: pin.value }),
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "Wrong PIN");
        location.href = "/";
      } catch (ex) {
        err.hidden = false;
        err.textContent = String(ex.message || ex);
      }
    });
    pin.focus();
  </script>
</body>
</html>
